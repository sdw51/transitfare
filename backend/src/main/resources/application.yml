spring:
  application:
    name: transitfare
  profiles:
    default: dev          # 프로필 없이 실행하면 dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false        # Boot 자동 Flyway 끄고 ModuleFlywayConfig가 모듈별로 실행

app:
  modules: transit,pass,itinerary,directions

springdoc:
  swagger-ui:
    path: /swagger-ui

route:
  provider: ${ROUTE_PROVIDER:fake}

google:
  routes:
    api-key: ${GOOGLE_ROUTES_API_KEY:}
